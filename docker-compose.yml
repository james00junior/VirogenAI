services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      VIROGENAI_ENV: development
      VIROGENAI_DATABASE_URL: postgresql://virogenai:virogenai@postgres:5432/virogenai
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: virogenai
      POSTGRES_USER: virogenai
      POSTGRES_PASSWORD: virogenai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virogenai -d virogenai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
